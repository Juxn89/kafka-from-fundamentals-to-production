name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Node runs the .ts files directly, so type-checking is the only compile step.
      - name: Type-check both parts
        run: |
          for part in part-1 part-2; do
            (cd "$part" && npm ci --ignore-scripts --no-audit --no-fund && npx tsc -p .)
          done

      # Runs each part on a fresh broker and checks the behaviour its article relies on.
      - name: Run and verify
        run: bash scripts/verify.sh
